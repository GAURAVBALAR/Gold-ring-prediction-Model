services:
  # 1. Backend API Service
  - type: web
    name: gold-weight-api
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --timeout 120"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/gold_weight.db
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: VECTOR_DB_TYPE
        value: pinecone
      - key: PINECONE_INDEX_NAME
        value: ring-designs-gemini
      - key: EMBEDDING_TYPE
        value: gemini
      - key: PINECONE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: gold-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  # 2. Frontend Static Site Service
  - type: static
    name: gold-weight-frontend
    env: static
    buildCommand: "npm install && npm run build"
    publishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: gold-weight-api
          property: host
